<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>rtosu Example</title>
<link rel="stylesheet" href="index.css">
<script src="index.js" defer></script>
</head>
<body>
<div class="panel">
  <!-- Map art is stretched across the whole header so it reads as a banner
       rather than a thumbnail. The gradient keeps the text legible. -->
  <header class="banner" id="banner">
    <div class="banner-text">
      <div class="artist" id="artist">waiting for osu!</div>
      <div class="title" id="title">no beatmap</div>
      <div class="diff" id="diff">&nbsp;</div>
    </div>
  </header>

  <div class="stats">
    <div class="stat">
      <span class="label">current pp</span>
      <span class="value" id="pp">0.00</span>
    </div>
    <div class="stat">
      <span class="label">pp if FC</span>
      <span class="value" id="ppfc">0.00</span>
    </div>
    <div class="stat stat-combo">
      <span class="label">combo</span>
      <span class="value" id="combo">0 / 0</span>
    </div>
    <div class="stat">
      <span class="label">ur</span>
      <span class="value" id="ur">0.00</span>
    </div>
  </div>

  <div class="stats hits" id="hitsRow">
    <div class="stat hit hit-acc">
      <span class="label label-plain">accuracy</span>
      <span class="value" id="acc">0.00%</span>
    </div>
    <div class="stat hit hit-100">
      <span class="label label-plain">100<span class="unit">s</span></span>
      <span class="value" id="hit100">0</span>
    </div>
    <div class="stat hit hit-50">
      <span class="label label-plain">50<span class="unit">s</span></span>
      <span class="value" id="hit50">0</span>
    </div>
    <div class="stat hit hit-miss">
      <span class="label label-plain">miss</span>
      <span class="value" id="hitMiss">0</span>
    </div>
  </div>

  <div class="tourney" id="tourney" hidden>
    <div class="tourney-title">tournament clients <span class="count" id="clientCount"></span></div>
    <div class="players" id="players"></div>
  </div>

  <footer class="footer">
    <span class="state" id="state">connecting&hellip;</span>
    <span class="mods" id="mods" hidden></span>
  </footer>
</div>
</body>
</html>
