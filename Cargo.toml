[package]
name = "rtosu-dataprovider"
version = "1.0.0"
edition = "2024"
authors = ["Raregendary <thehellpuma@gmail.com>"]
license = "MIT"
description = "A lightweight native Rust data provider emitting tosu-compatible v2 JSON and WebSocket feeds for osu!"
repository = "https://github.com/Raregendary/rtosu-dataprovider"
readme = "README.md"
keywords = ["osu", "tosu", "overlay", "tournament", "memory-reader"]
categories = ["games", "command-line-utilities", "multimedia"]

[features]
default = ["pp"]
pp = ["dep:rosu-pp", "dep:rosu-mods"]
rosu-mem = ["dep:rosu-mem"]
rosu-memory = ["rosu-mem"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
md-5 = "0.11"
toml = "1.1"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.7", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rosu-mem = { version = "3.0", optional = true }
rosu-pp = { git = "https://github.com/Raregendary/rosu-pp-gemini", optional = true }
rosu-mods = { version = "0.4.1", optional = true }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

