[package]
name = "osumemoryreading"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = []
pp = ["dep:rosu-pp", "dep:rosu-mods"]
rosu-mem = ["dep:rosu-mem"]
rosu-memory = ["rosu-mem"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
rosu-mem = { version = "3.0", optional = true }
rosu-pp = { git = "https://github.com/Raregendary/rosu-pp-gemini", optional = true }
rosu-mods = { version = "0.4.1", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }
