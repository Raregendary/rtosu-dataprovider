[package]
name = "rtosu-dataprovider"
version = "1.0.2"
edition = "2024"
authors = ["Raregendary <raregendary@gmail.com>"]
license = "MIT"
description = "A lightweight native Rust data provider emitting tosu-compatible v2 JSON and WebSocket feeds for osu!"
repository = "https://github.com/Raregendary/rtosu-dataprovider"
readme = "README.md"
keywords = ["osu", "tosu", "overlay", "tournament", "memory-reader"]
categories = ["games", "command-line-utilities", "multimedia"]

[features]
default = ["pp"]
pp = ["dep:rosu-pp", "dep:rosu-mods"]
rosu-mem = ["dep:rosu-mem"]
rosu-memory = ["rosu-mem"]
# Enables the dhat allocation profiler inside the `live_harness` bench target.
# Empty feature: `dhat` is a dev-dependency, so it is only linked into benches.
dhat-heap = []
# Enables per-phase timing counters (src/instr.rs). Off by default: with the
# feature disabled the `instr_scope!`/`instr_bytes!` macros expand to nothing.
instr = []

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = { version = "1.0", features = ["raw_value"] }
md-5 = "0.11"
toml = "1.1"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.7", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rosu-mem = { version = "3.0", optional = true }
rosu-pp = { package = "rosu-pp-gemini", version = "5.0.1", optional = true }
rosu-mods = { version = "0.4.1", optional = true }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support", "html_reports"] }
dhat = "0.3"

[[bench]]
name = "micro"
harness = false

[[bench]]
name = "live_harness"
harness = false

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

# Benchmark profiles: `cargo bench` uses the `bench` profile (inherits release),
# but keep it explicit so `cargo bench` and the release binary stay comparable.
[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false

